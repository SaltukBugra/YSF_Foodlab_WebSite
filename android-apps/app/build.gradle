plugins {
	id "com.android.application"
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
	keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
	namespace "tr.com.ysffoodlab.staff"
	compileSdk 34

	defaultConfig {
		minSdk 24
		targetSdk 34
		versionCode 4
		versionName "1.4.2"
	}

	flavorDimensions "role"
	productFlavors {
		garson {
			dimension "role"
			applicationId "tr.com.ysffoodlab.garson"
			resValue "string", "app_name", "YSF Garson"
			buildConfigField "String", "START_URL", '"https://www.ysffoodlab.com.tr/garson/"'
			buildConfigField "boolean", "KEEP_SCREEN_ON", "false"
		}
		mutfak {
			dimension "role"
			applicationId "tr.com.ysffoodlab.mutfak"
			resValue "string", "app_name", "YSF Mutfak"
			buildConfigField "String", "START_URL", '"https://www.ysffoodlab.com.tr/mutfak-ekrani/"'
			buildConfigField "boolean", "KEEP_SCREEN_ON", "true"
		}
		kasiyer {
			dimension "role"
			applicationId "tr.com.ysffoodlab.kasiyer"
			resValue "string", "app_name", "YSF Kasiyer"
			buildConfigField "String", "START_URL", '"https://www.ysffoodlab.com.tr/kasiyer/"'
			buildConfigField "boolean", "KEEP_SCREEN_ON", "true"
		}
	}

	signingConfigs {
		release {
			if (hasReleaseKeystore) {
				storeFile rootProject.file(keystoreProperties["storeFile"])
				storePassword keystoreProperties["storePassword"]
				keyAlias keystoreProperties["keyAlias"]
				keyPassword keystoreProperties["keyPassword"]
			}
		}
	}

	buildTypes {
		release {
			minifyEnabled false
			if (hasReleaseKeystore) {
				signingConfig signingConfigs.release
			} else {
				signingConfig signingConfigs.debug
			}
		}
	}

	buildFeatures {
		buildConfig true
	}

	compileOptions {
		sourceCompatibility JavaVersion.VERSION_17
		targetCompatibility JavaVersion.VERSION_17
	}
}

if (!hasReleaseKeystore) {
	logger.warn("UYARI: android-apps/keystore.properties bulunamadı. Release APK debug anahtarıyla imzalanır ve DAĞITILMAMALIDIR.")
	gradle.taskGraph.whenReady { graph ->
		if (graph.allTasks.any { it.name.contains("Release") }) {
			logger.warn("WARNING: Release APK is DEBUG-SIGNED (android-apps/keystore.properties missing). Do NOT distribute this APK.")
		}
	}
}
